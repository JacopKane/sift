[project]
name = "sift"
version = "0.1.0"
description = "A disk analyzer that knows what's safe to delete"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "sse-starlette>=2.1",
    "langchain>=0.3",
    "langgraph>=0.2",
    "langchain-google-genai>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-bdd>=8.1",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sift"]

# ---------------------------------------------------------------- pytest ----

[tool.pytest.ini_options]
testpaths = ["tests"]
bdd_features_base_dir = "tests/features"
markers = [
    "slow: filesystem-heavy or end-to-end scenarios; excluded from the pre-commit hook",
]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
filterwarnings = [
    "error",
    # pytest-bdd 8.x against pytest 8.4+; upstream, nothing we can fix here.
    "ignore:Passing (nodeid|baseid) to:pytest.PytestRemovedIn10Warning",
]

# ------------------------------------------------------------------ ruff ----

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle, pyflakes
    "I",            # isort
    "UP",           # pyupgrade
    "B",            # bugbear
    "SIM",          # simplify
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B008"]

# ------------------------------------------------------------------ mypy ----

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pytest_bdd.*", "sse_starlette.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
