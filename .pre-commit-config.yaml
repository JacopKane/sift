# Installed with:
#   pre-commit install && pre-commit install --hook-type pre-push
#
# Commit  -> format, lint, types, fast tests
# Push    -> the full suite, including slow filesystem scenarios

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff-format
      - id: ruff
        args: [--fix]

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy sift
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest-fast
        name: pytest (fast suite)
        entry: uv run pytest -m "not slow" -q
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest-full
        name: pytest (full suite)
        entry: uv run pytest -q
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
