# Installed with:
#   pre-commit install && pre-commit install --hook-type pre-push
#
# Commit  -> format, lint, types, fast tests
# Push    -> the full suite, including slow filesystem scenarios

# Generated frontend bundles are committed so a fresh clone runs without npm.
# Formatting hooks must not touch them — rewriting minified JS is at best noise
# and at worst corruption.
exclude: '^sift/api/static/'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: detect-private-key

  - repo: local
    hooks:
      # The project's own ruff, not a pinned copy. A separately versioned hook
      # formats differently from the one in the venv, so every commit reformatted
      # what the last run had just formatted.
      - id: ruff-format
        name: ruff format
        entry: .venv/bin/ruff format
        language: system
        types: [python]

      - id: ruff
        name: ruff
        entry: .venv/bin/ruff check --fix
        language: system
        types: [python]

      # always_run, deliberately. With `types: [python]` these are skipped on any
      # commit that touches no Python — and a README that describes behaviour the
      # code no longer has is exactly the kind of drift worth catching.
      - id: mypy
        name: mypy
        entry: uv run mypy sift
        language: system
        always_run: true
        pass_filenames: false

      - id: pytest-fast
        name: pytest (fast suite)
        entry: uv run pytest -m "not slow" -q
        language: system
        always_run: true
        pass_filenames: false

      - id: pytest-full
        name: pytest (full suite)
        entry: uv run pytest -q
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
